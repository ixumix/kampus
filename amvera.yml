# Amvera Cloud — файл из мастера создания проекта: сборка по Dockerfile, постоянное хранилище /data (база SQLite),
# порт 8080, один экземпляр (singleton) — SQLite не делится между копиями приложения.
meta:
  environment: docker
  toolchain:
    name: docker
build:
  dockerfile: Dockerfile
  skip: false
run:
  image: null
  command: null
  args: null
  persistenceMount: /data
  containerPort: "8080"
  singleton: true
  zeroDowntime: false
